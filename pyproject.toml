[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fidelitymem"
version = "0.1.0"
description = "Recall-constrained adaptive hybrid memory for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fidelitymem-bench = "fidelitymem.eval.cli:main"

[tool.setuptools.packages.find]
include = ["fidelitymem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
